<div class="content-header">
    <h4>Booking Ruangan</h4>

    <p>
        Buat booking ruangan baru.
    </p>
</div>

<div class="dashboard-card">
    <h5 class="mb-3">Form Pengajuan Booking</h5>
    <form id="bookingForm">
        <div class="mb-3">
            <label for="room" class="form-label">
                Ruangan
            </label>

            <select id="room" class="form-select" required>
                <option value="">
                    Pilih ruangan
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="bookingName" class="form-label">
                Nama Booking
            </label>

            <input
                type="text"
                id="bookingName"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label for="bookingDate" class="form-label">
                Tanggal
            </label>

            <input
                type="date"
                id="bookingDate" 
                class="form-control"
                required
                onclick="this.showPicker()">
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label
                    for="startTime"
                    class="form-label"
                    >
                    Waktu Mulai
                </label>

                <input
                    type="time"
                    id="startTime"
                    class="form-control"
                    onclick="this.showPicker()"
                    required>
            </div>

            <div class="col-md-6 mb-3">
                <label
                    for="endTime"
                    class="form-label"
                    >
                    Waktu Selesai
                </label>

                <input
                    type="time"
                    id="endTime"
                    class="form-control"
                    onclick="this.showPicker()"
                    required>
            </div>

        </div>

        <button
            type="submit" class="btn btn-primary">
            Simpan Booking
        </button>
    </form>

</div>

<div class="dashboard-card mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h5 class="mb-0" id="calendarMonthYear">Memuat Kalender...</h5>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-primary" id="prevMonthBtn">&lt; Past</button>
            <button class="btn btn-outline-secondary" id="todayBtn">Today</button>
            <button class="btn btn-outline-primary" id="nextMonthBtn">Next &gt;</button>
        </div>
    </div>

    <div class="calendar-grid-header border-bottom mb-2">
        <div class="calendar-day-header text-danger">Min</div>
        <div class="calendar-day-header">Sen</div>
        <div class="calendar-day-header">Sel</div>
        <div class="calendar-day-header">Rab</div>
        <div class="calendar-day-header">Kam</div>
        <div class="calendar-day-header">Jum</div>
        <div class="calendar-day-header text-primary">Sab</div>
    </div>

    <!-- Grid Tanggal -->
    <div class="calendar-grid" id="calendarGrid">
        <p class="text-muted col-span-7 p-3">Memuat tanggal...</p>
    </div>

    <!-- Container Detail Kegiatan -->
    <div id="selectedDateDetail" class="mt-3 p-3 bg-light rounded border" style="display: none;">
        <h6 class="fw-bold text-primary mb-2" id="selectedDateTitle">Jadwal Ruangan</h6>
        <div id="selectedDateEventsList">
            <p class="text-muted">Memuat jadwal...</p>
        </div>
    </div>
</div>
