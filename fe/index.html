<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Booking Room</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ========================================== -->
    <!-- HEADER -->
    <!-- ========================================== -->

    <header class="top-header">

        <div class="brand">
            Booking Room
        </div>

        <div class="user-info">
            <span id="usernameDisplay">
                Loading...
            </span>

            <span
                class="user-role"
                id="roleDisplay">
            </span>
        </div>

    </header>


    <!-- ========================================== -->
    <!-- MAIN LAYOUT -->
    <!-- ========================================== -->

    <div class="main-container">


        <!-- ====================================== -->
        <!-- SIDEBAR -->
        <!-- ====================================== -->

        <aside class="sidebar">

            <!-- MENU -->
            <div class="menu-title">
                Menu
            </div>

            <ul class="nav-menu">

                <li>
                    <button
                        type="button"
                        class="menu-button active"
                        data-page="dashboard">

                        Dashboard

                    </button>
                </li>


                <li>
                    <button
                        type="button"
                        class="menu-button"
                        data-page="schedule">

                        Jadwal Ruangan

                    </button>
                </li>


                <li>
                    <button
                        type="button"
                        class="menu-button"
                        data-page="booking">

                        Booking Ruangan

                    </button>
                </li>

            </ul>


            <!-- ================================== -->
            <!-- ADMIN MENU -->
            <!-- ================================== -->

            <div
                id="adminMenu"
                style="display: none;">

                <div class="menu-title">
                    Administrator
                </div>

                <ul class="nav-menu">

                    <li>
                        <button
                            type="button"
                            class="menu-button"
                            data-page="admin-room">

                            Kelola Ruangan

                        </button>
                    </li>


                    <li>
                        <button
                            type="button"
                            class="menu-button"
                            data-page="admin-booking">

                            Kelola Booking

                        </button>
                    </li>

                </ul>

            </div>


            <!-- ================================== -->
            <!-- ACCOUNT MENU -->
            <!-- ================================== -->

            <div class="menu-title">
                Account
            </div>

            <ul class="nav-menu">

                <li>
                    <button
                        type="button"
                        id="logoutButton"
                        class="logout-button">

                        Logout

                    </button>
                </li>

            </ul>

        </aside>


        <!-- ====================================== -->
        <!-- CONTENT -->
        <!-- ====================================== -->

        <main class="content">

            <div id="contentArea">
                Memuat halaman...
            </div>

        </main>

    </div>


    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->

    <!-- Bootstrap -->
    <script src="js/bootstrap.bundle.min.js"></script>


    <!-- Application JavaScript -->

    <!-- Authentication / Logout -->
    <script src="js/auth.js"></script>

    <!-- Schedule -->
    <script src="js/schedule.js"></script>

    <!-- Booking -->
    <script src="js/booking.js"></script>

    <!-- Admin Room -->
    <script src="js/admin-room.js"></script>

    <!-- Admin Booking -->
    <script src="js/admin-booking.js"></script>

    <!-- Main Application -->
    <script src="js/app.js"></script>

</body>

</html>
