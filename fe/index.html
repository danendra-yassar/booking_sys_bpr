<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Booking Room</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="top-header">
        
        <div class="brand">
            Booking Room
        </div>

        <div class="user-info">
            <span id="usernameDisplay">
                Loading...
            </span>
            <span
                class="user-role"
                id="roleDisplay">
            </span>
        </div>

    </header>

    <div class="main-container">
        
        <aside class="sidebar">
            
            <div class="menu-title">
                Menu
            </div>

            <hr>
            
            <ul class="nav-menu">
                <li>
                    <button
                        type="button"
                        class="menu-button active"
                        data-page="dashboard">
                        Dashboard
                    </button>
                </li>

                <li>
                    <button
                        type="button"
                        class="menu-button"
                        data-page="schedule">
                        Jadwal Ruangan
                    </button>
                </li>

                <li>
                    <button
                        type="button"
                        class="menu-button"
                        data-page="booking">
                        Booking Ruangan
                    </button>
                </li>
            </ul>

            <div id="adminMenu" style="display: none;">
                <div class="menu-title">
                    Administrator
                </div>

                <hr>
                
                <ul class="nav-menu">
                    <li>
                        <button
                            type="button"
                            class="menu-button"
                            data-page="admin-room">
                            Kelola Ruangan
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="menu-button"
                            data-page="admin-booking">
                            Kelola Booking
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="menu-button"
                            data-page="admin-user">
                            Kelola User
                        </button>
                    </li>
                </ul>
            </div>

            <div class="menu-title">
                Account
            </div>

            <hr>

            <ul class="nav-menu">
                <li>
                    <button
                        type="button"
                        id="logoutButton"
                        class="logout-button">
                        Logout
                    </button>
                </li>
            </ul>
        </aside>

        <main class="content">
            <div id="contentArea">
                Memuat halaman...
            </div>
        </main>
    </div>


    <script src="js/bootstrap.bundle.min.js"></script>

    <script src="js/auth.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/admin-room.js"></script>
    <script src="js/admin-booking.js"></script>
    <script src="js/admin-user.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
